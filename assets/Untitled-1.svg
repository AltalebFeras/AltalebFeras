<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#neonBg)"/>
  
  <!-- Circuit patterns -->
  <g stroke="#00ff41" stroke-width="2" fill="none" opacity="0.3">
    <path d="M100,100 L200,100 L200,150 L300,150"/>
    <path d="M900,250 L1000,250 L1000,300 L1100,300"/>
    <circle cx="200" cy="100" r="5" fill="#00ff41"/>
    <circle cx="1000" cy="250" r="5" fill="#00ff41"/>
  </g>
  
  <!-- Main content -->
  <g transform="translate(100, 120)">
    <text x="0" y="0" font-family="Orbitron, monospace" font-size="32" font-weight="400" fill="#00ff41" filter="url(#neonGlow)">
      &gt; INITIALIZING...
    </text>
    <text x="0" y="60" font-family="Orbitron, monospace" font-size="56" font-weight="900" fill="#ff0080" filter="url(#neonGlow)">
      FERAS ALTALEB
    </text>
    <text x="0" y="100" font-family="Orbitron, monospace" font-size="24" font-weight="600" fill="#00bfff" filter="url(#neonGlow)">
      [DEVELOPER.EXE]
    </text>
    <text x="0" y="130" font-family="JetBrains Mono, monospace" font-size="16" fill="#ffffff" opacity="0.8">
      Status: Active | Mode: Full-Stack | Location: Grenoble.fr
    </text>
  </g>
  
  <!-- Matrix-style elements -->
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#00ff41" opacity="0.4">
    <text x="900" y="100">01001000</text>
    <text x="900" y="120">01100101</text>
    <text x="900" y="140">01101100</text>
    <text x="1000" y="350">console.log('hello');</text>
  </g>
</svg>