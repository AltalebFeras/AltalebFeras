<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arrière-plan -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Partie gauche : Profil - Full height -->
  <g transform="translate(60, 40)" font-family="JetBrains Mono, monospace">
    <text x="0" y="0" font-size="48" font-weight="bold" fill="#ff00aa" filter="url(#glow)">
      echo "FERAS ALTALEB";
    </text>
    <text x="0" y="40" font-size="20" fill="#00bfff" filter="url(#glow)">
      Concepteur &amp; Développeur Full-Stack
    </text>
    <text x="0" y="100" font-size="14" fill="#00ff41">
      Localisation : Grenoble, France • Statut : Disponible
    </text>
    <text x="0" y="125" font-size="12" fill="#bbbbbb">
      Formation : Concepteur Développeur d'Applications chez Simplon
    </text>
    <text x="0" y="145" font-size="12" fill="#bbbbbb">
      Transition : Ingénieur Génie Civil → Développeur Web &amp; Mobile
    </text>
    
    <!-- Additional content to fill height -->
    <text x="0" y="180" font-size="16" font-weight="bold" fill="#ff00aa">🚀 Projets récents</text>
    <text x="0" y="205" font-size="12" fill="#dddddd">
      • Application web e-commerce avec Symfony &amp; React
    </text>
    <text x="0" y="225" font-size="12" fill="#dddddd">
      • API REST pour application mobile iOS/Android
    </text>
    <text x="0" y="245" font-size="12" fill="#dddddd">
      • Dashboard analytics avec Next.js &amp; TypeScript
    </text>
    
    <text x="0" y="280" font-size="16" font-weight="bold" fill="#00bfff">💼 Expérience</text>
    <text x="0" y="305" font-size="12" fill="#dddddd">
      Développement d'applications web modernes et responsives
    </text>
    <text x="0" y="325" font-size="12" fill="#dddddd">
      Intégration d'APIs et bases de données relationnelles
    </text>
    <text x="0" y="345" font-size="12" fill="#dddddd">
      Déploiement et containerisation avec Docker
    </text>
  </g>

  <!-- Partie droite : Code + Terminal -->
  <g transform="translate(650, 60)" font-family="JetBrains Mono, monospace" font-size="12">
    <!-- Profile info replacing terminal -->
    <g fill="#bbbbbb" opacity="0.85">
      <text x="0" y="0" fill="#ff00aa" font-weight="bold" font-size="14">👋 Bonjour, je suis Feras Altaleb</text>
      <text x="0" y="22">🎓 Développeur Web &amp; Mobile | Passionné par le code et la création d'applications</text>
      <text x="0" y="40">📍 Basé à Grenoble, France</text>

      <text x="0" y="66" fill="#00bfff" font-weight="bold">🧑‍💻 À propos de moi</text>
      <text x="0" y="84" font-size="11" fill="#dddddd">
        Développeur fullstack en formation Concepteur Développeur d'Applications chez Simplon.
      </text>
      <text x="0" y="100" font-size="11" fill="#dddddd">
        Ancien ingénieur en génie civil, réorienté vers le développement web &amp; mobile.
      </text>

      <text x="0" y="126" fill="#00ff41" font-weight="bold">🛠️ Compétences techniques</text>
      <text x="0" y="144" font-size="11" fill="#dddddd">
        Front-End : React, Next.js, TypeScript, TailwindCSS, Bootstrap
      </text>
      <text x="0" y="160" font-size="11" fill="#dddddd">
        Back-End : PHP, Symfony, API REST, Ajax, Fetch
      </text>
      <text x="0" y="176" font-size="11" fill="#dddddd">
        Mobile : Kotlin, Swift
      </text>
      <text x="0" y="192" font-size="11" fill="#dddddd">
        Bases de données : MySQL, MongoDB
      </text>
      <text x="0" y="208" font-size="11" fill="#dddddd">
        Outils &amp; DevOps : Git, GitHub/GitLab CI, Docker
      </text>
    </g>

    <!-- Code profil -->
    <g fill="#00bfff" transform="translate(0, 230)">
      <text x="0" y="0">const profil = &#123;</text>
      <text x="20" y="20">nom: "Feras Altaleb",</text>
      <text x="20" y="40">ville: "Grenoble",</text>
      <text x="20" y="60">technos: ["PHP", "Symfony", "React", "TypeScript", "MySQL" ,...etc],</text>
      <text x="20" y="80">disponible: true</text>
      <text x="0" y="100">&#125;;</text>
    </g>

    <!-- Fonction -->
    <g fill="#ff00aa" transform="translate(0, 350)">
      <text x="0" y="0">function innover(code, design) &#123;</text>
      <text x="20" y="20">return code + design + " ⚡️";</text>
      <text x="0" y="40">&#125;</text>
    </g>
  </g>
</svg>
